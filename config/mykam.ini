# MyKam settings. Copy this file into the MyKam plugin folder (next to win_x64).
# transition_seconds: how long a camera switch takes, from 0 (instant cut) to 10 seconds.
# A missing file, a missing key or an invalid value falls back to 1.5.
transition_seconds = 1.5
# handoff_view: what happens after an outside camera has arrived at a saved spot.
#   saved (default) = switch to the X-Plane view type the slot was saved in (chase, circle, tower, ...),
#                     or to the free camera (key C) when the slot has no stored view
#   free            = always switch to X-Plane's free camera
#   off             = keep holding the camera with MyKam's own mouse and key control
# Any other value counts as saved.
handoff_view = saved
# free_camera_handoff is the older key (0 = off, 1 = saved). It is only read when handoff_view is missing.

# The MyKam window (Plugins > MyKam > Show window) writes the settings on this page back to
# this file when you change them there. Comments and other lines you add here are kept.
# show_quick_bar: 1 shows the slim bar of slot buttons on the screen, 0 hides it.
show_quick_bar = 1
# quick_bar_position: bottom (default) or top of the main screen.
quick_bar_position = bottom
# quick_bar_views: which X-Plane view buttons the quick bar shows, in this order. Short names, comma
# separated: cockpit, free, chase, circle, tower, runway, linear_spot, still_spot, ridealong, wingman.
# Unknown names are ignored, repeats are dropped, an empty value shows none. Release and the menu
# button always stay. The Settings page of the window changes this for you.
quick_bar_views = cockpit,free,chase
# key_hint_go / key_hint_save: the text shown on the slot cards. They are only labels; the real keys
# are bound in X-Plane's keyboard settings. {n} becomes the slot number. Up to 32 printable ASCII
# characters; leave the value empty to hide the hint.
key_hint_go = Numpad {n}
key_hint_save = Ctrl+Alt+Numpad {n}
